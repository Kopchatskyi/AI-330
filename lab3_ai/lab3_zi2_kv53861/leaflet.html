<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maps with Leaflet</title>
    <link rel="stylesheet" href="leaflet-1.7.1/leaflet.css" />
    <script src="leaflet-1.7.1/leaflet-src.js"></script>
    <script src="leaflet-1.7.1/leaflet-providers.js"></script>
    <script src="leaflet-1.7.1/leaflet-image.js"></script>
    <style>
        #map {
            width: 600px;
            height: 300px;
            border: 1px solid black;
        }

        /* Adjusted size for the puzzle target grid */
        #puzzle-target {
            width: 310px; /* Slightly larger to accommodate borders */
            height: 310px; /* Slightly larger to accommodate borders */
            display: grid;
            grid-template-columns: repeat(4, 75px);
            grid-template-rows: repeat(4, 75px);
            gap: 2px;
            border: 2px solid #333;
            margin: 20px auto;
        }

        #puzzle-board {
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-columns: repeat(4, 75px);
            grid-template-rows: repeat(4, 75px);
            gap: 2px;
            border: 2px solid #333;
            margin: 20px auto;
        }

        .puzzle-piece {
            width: 75px;
            height: 75px;
            border: 1px solid #000;
            cursor: grab;
            background-size: cover;
        }

        .puzzle-cell {
            width: 75px;
            height: 75px;
            border: 1px dashed #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h2{
            text-align: center;
        }
        button {
            margin: 10px;
        }
    </style>
</head>
<body>
<div id="map"></div>
<button id="getLocation">Get Current Location</button>
<button id="saveButton">Save Raster Map</button>

<h2>Puzzle area</h2>
<div id="puzzle-target"></div>


<div id="puzzle-board"></div>

<script src="script.js"></script>
</body>
</html>
