<!doctype html>
<html class="no-js" lang="">


<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather forecast</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>


<div class="weather_input_form">
  <h1> Weather forecast</h1>
  <input type="text" value="Enter city" id="input_city">
  <button id="btn_chk_weather">Check weather</button>
</div>

<div id="weather_output_form">
  <div class="weather_block">
    <div class="weather_date"></div>
    <div class="weather_temperature"></div>
    <div class="weather_temp_feels_like"></div>
    <img class="weather_icon" src="https://openweathermap.org/img/wn/10d@2x.png">
    <div class="weather_description"></div>
  </div>
</div>



<script src="js/app.js"></script>

</body>

</html>
